<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="Truva kıyı çizgisinin üç aşaması: MÖ 3000'de deniz tepenin dibinde, MÖ 1200'de iki üç kilometrelik koy, bugün beş altı kilometrelik alüvyon ovası">
  <style>
    :root { --ink:#33312e; --paper:#fffff8; --accent:#9c6b3f; }
    .ink  { stroke:var(--ink); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .thin { stroke:var(--ink); fill:none; stroke-width:1.1; stroke-linecap:round; }
    .sea  { fill:var(--ink); fill-opacity:.10; }
    .acl  { stroke:var(--accent); fill:none; stroke-width:1.6; stroke-linecap:round; }
    text  { font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif; fill:var(--ink); }
    .ttl  { font-size:14.5px; }
    .sm   { font-size:11.5px; font-style:italic; opacity:.75; }
    .ac   { fill:var(--accent); }
    .mk   { stroke:var(--ink); fill:none; stroke-width:1.4; }
    .mkac { stroke:var(--accent); fill:none; stroke-width:1.4; }
    .sep  { stroke:var(--ink); stroke-width:1; opacity:.22; stroke-dasharray:3 6; }

    /* Dark mode. Light strokes on a dark ground lose far more to antialiasing
       than dark strokes on paper do, and on a phone the diagram is scaled down
       on top of that, so the hairlines and the faintest fills carry a little
       more weight here than they do on white. Geometry is untouched. */
    @media (prefers-color-scheme: dark) {
      :root { --ink:#dddddd; --paper:#151515; --accent:#cf9d63; }
      .ink  { stroke-width:1.8; }
      .thin { stroke-width:1.4; }
      .acl  { stroke-width:1.8; }
      .sea  { fill-opacity:.16; }
      .sm   { opacity:.85; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0,1 L9,5 L0,9"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mkac" d="M0,1 L9,5 L0,9"/>
    </marker>
  </defs>

  <!-- panel ayraclari -->
  <g class="sep">
    <line x1="312" y1="92" x2="312" y2="272"/>
    <line x1="627" y1="92" x2="627" y2="272"/>
  </g>

  <!-- degismeyen: poyraz -->
  <path class="acl" marker-end="url(#aha)" d="M905,64 C700,50 480,80 265,62 C190,56 130,66 60,72"/>
  <text class="sm ac" x="905" y="46" text-anchor="end">poyraz — üç panelde de aynı rüzgâr</text>

  <g>
    <!-- ===== P1: x0 = 10 ===== -->
    <rect class="sea" x="18" y="188" width="192" height="16"/>
    <path class="thin" d="M22,193 q8,-4 16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 M22,201 q8,-4 16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0"/>
    <path class="ink" d="M210,204 L296,204"/>
    <path class="ink" d="M220,204 L258,166 L292,204"/>

    <!-- ===== P2: x0 = 325 ===== -->
    <rect class="sea" x="333" y="188" width="112" height="16"/>
    <path class="thin" d="M337,193 q8,-4 16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0 M337,201 q8,-4 16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0"/>
    <path class="ink" d="M445,204 L611,204"/>
    <path class="ink" d="M535,204 L573,166 L607,204"/>
    <!-- kiyiya cekilmis gemiler -->
    <path class="thin" d="M452,200 q11,9 22,0 M463,200 L463,186 M463,186 L472,192 L463,195"/>
    <path class="thin" d="M482,200 q11,9 22,0 M493,200 L493,186 M493,186 L502,192 L493,195"/>

    <!-- ===== P3: x0 = 640 ===== -->
    <rect class="sea" x="648" y="188" width="22" height="16"/>
    <path class="thin" d="M650,193 q8,-4 16,0 M650,201 q8,-4 16,0"/>
    <path class="ink" d="M670,204 L926,204"/>
    <path class="ink" d="M850,204 L888,166 L922,204"/>
    <!-- alüvyon ovasi: tarla izleri -->
    <path class="thin" opacity=".55" d="M682,211 L702,211 M712,211 L732,211 M742,211 L762,211 M772,211 L792,211 M802,211 L822,211 M692,218 L712,218 M722,218 L742,218 M752,218 L772,218 M782,218 L802,218 M812,218 L832,218"/>
  </g>

  <!-- basliklar -->
  <g class="ttl" text-anchor="middle">
    <text x="155" y="104">MÖ ~3000</text>
    <text x="470" y="104">MÖ ~1200</text>
    <text x="785" y="104">Bugün</text>
  </g>
  <g class="sm" text-anchor="middle">
    <text x="155" y="120">Truva I–II</text>
    <text x="470" y="120">Truva VI–VIIa</text>
    <text x="785" y="120">Hisarlık</text>
  </g>

  <!-- kale etiketleri -->
  <g class="sm" text-anchor="middle">
    <text x="256" y="158">kale</text>
    <text x="571" y="158">kale</text>
    <text x="886" y="158">kale</text>
  </g>

  <!-- mesafe olculeri -->
  <g class="thin">
    <path marker-start="url(#ah)" marker-end="url(#ah)" d="M447,236 L533,236"/>
    <path marker-start="url(#ah)" marker-end="url(#ah)" d="M672,236 L848,236"/>
  </g>
  <g class="sm" text-anchor="middle">
    <text x="205" y="256">deniz tepenin eteğinde</text>
    <text x="490" y="256">~2–3 km korunaklı koy</text>
    <text x="760" y="256">~5–6 km alüvyonla dolmuş kuru tarla</text>
  </g>
  <text class="sm" x="490" y="274" text-anchor="middle">Yunanlar gemilerini buraya çekti</text>
</svg>
