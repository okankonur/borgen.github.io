<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="940" height="240" role="img" aria-label="The Drake equation: N equals R star times fp times ne times fl times fi times fc times L. The first six terms ask how many, while the last term, L, asks for how long.">
  <style>
    :root { --ink:#33312e; --paper:#fffff8; --accent:#9c6b3f; }
    text   { font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif; fill:var(--ink); }
    .eq    { font-size:27px; font-style:italic; }
    .sub   { font-size:16px; font-style:normal; }
    .op    { font-size:18px; font-style:normal; opacity:.55; }
    .lab   { font-size:11.5px; }
    .sm    { font-size:12px; font-style:italic; opacity:.75; }
    .thin  { stroke:var(--ink); fill:none; stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round; opacity:.55; }
    .thinac{ stroke:var(--accent); fill:none; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
    .box   { fill:var(--accent); fill-opacity:.10; stroke:var(--accent); stroke-width:1.4; }
    .ac    { fill:var(--accent); }

    /* Dark mode. Light strokes on a dark ground lose far more to antialiasing
       than dark strokes on paper do, and on a phone the diagram is scaled down
       on top of that, so the hairlines and the faintest fills carry a little
       more weight here than they do on white. Geometry is untouched. */
    @media (prefers-color-scheme: dark) {
      :root { --ink:#dddddd; --paper:#151515; --accent:#cf9d63; }
      .thin  { stroke-width:1.3; opacity:.70; }
      .thinac{ stroke-width:1.6; }
      .op    { opacity:.70; }
      .box   { fill-opacity:.16; stroke-width:1.6; }
      .sm    { opacity:.85; }
    }
  </style>

  <!-- the box setting the L term apart -->
  <rect class="box" x="819" y="66" width="112" height="108" rx="3"/>

  <!-- brackets above -->
  <g class="sm" text-anchor="middle">
    <text x="438" y="30">six terms ask “how many?”</text>
    <text class="ac" x="875" y="16">one asks</text>
    <text class="ac" x="875" y="32">“for how long?”</text>
  </g>
  <path class="thin"   d="M75,52 L75,42 L801,42 L801,52"/>
  <path class="thinac" d="M825,52 L825,42 L925,42 L925,52"/>

  <!-- the equation -->
  <g class="eq" text-anchor="middle">
    <text x="45" y="112">N</text>
    <text class="op" x="84" y="112">=</text>
    <text x="130" y="112">R<tspan class="sub" dy="6">∗</tspan></text>
    <text class="op" x="192" y="112">×</text>
    <text x="254" y="112">f<tspan class="sub" dy="6">p</tspan></text>
    <text class="op" x="316" y="112">×</text>
    <text x="378" y="112">n<tspan class="sub" dy="6">e</tspan></text>
    <text class="op" x="440" y="112">×</text>
    <text x="502" y="112">f<tspan class="sub" dy="6">l</tspan></text>
    <text class="op" x="564" y="112">×</text>
    <text x="626" y="112">f<tspan class="sub" dy="6">i</tspan></text>
    <text class="op" x="688" y="112">×</text>
    <text x="750" y="112">f<tspan class="sub" dy="6">c</tspan></text>
    <text class="op" x="812" y="112">×</text>
    <text class="ac" x="875" y="112">L</text>
  </g>

  <!-- what each term asks -->
  <g class="lab" text-anchor="middle">
    <text x="130" y="146">star formation rate</text>
    <text x="130" y="162">(stars per year)</text>
    <text x="254" y="146">fraction of stars</text>
    <text x="254" y="162">with planets</text>
    <text x="378" y="146">habitable planets</text>
    <text x="378" y="162">per system</text>
    <text x="502" y="146">fraction where life</text>
    <text x="502" y="162">begins</text>
    <text x="626" y="146">fraction developing</text>
    <text x="626" y="162">intelligence</text>
    <text x="750" y="146">fraction that sends</text>
    <text x="750" y="162">a signal</text>
    <text class="ac" x="875" y="146">how many years the</text>
    <text class="ac" x="875" y="162">signal keeps going</text>
  </g>

  <path class="thin" d="M45,196 L925,196"/>
  <g class="sm">
    <text x="45" y="222">N = the number of civilisations in the galaxy we could talk to right now.</text>
    <text class="ac" x="655" y="222" opacity="1">Our own L is ~120 years so far.</text>
  </g>
</svg>
